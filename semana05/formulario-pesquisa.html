<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 130 | Formulário HTML - Pesquisa de Usuário</title>
    <link rel="stylesheet" href="estilos/formulario-pesquisa.css">
</head>

<body>

    <header>
    </header>

    <main>
        <form>

            <fieldset>
                <legend>Informações de Contato</legend>

                <div class="item-formulario coluna2">
                    <label for="nome-completo">Nome Completo:</label>
                    <input type="text" id="nome-completo" name="nome-completo" required>
                </div>

                <div class="item-formulario coluna2">
                    <label for="emaildousuario">E-mail:</label>
                    <input type="email" id="emaildousuario" name="emaildousuario" required>
                </div>

            </fieldset>

            <fieldset>
                <legend>Perguntas</legend>

                <div class="item-formulario coluna1">
                    <label for="navegador">Qual é o seu navegador favorito?</label>

                    <select name="navegador" id="navegador">
                        <option value="chrome">Google Chrome</option>
                        <option value="firefox">Mozilla Firefox</option>
                        <option value="safari">Safari</option>
                    </select>
                </div>

                <div class="item-formulario coluna1">
                    <label>
                        <input type="checkbox" id="pet" name="pet">
                        Tenho um animal de estimação
                    </label>
                </div>

                <div class="item-formulario">
                    <label for="feedback">Conte-nos sua opinião:</label>
                    <textarea id="feedback" name="feedback" rows="4"></textarea>
                </div>

            </fieldset>

            <button type="submit">Enviar Pesquisa</button>

        </form>
    </main>

    <footer>
    </footer>

</body>

</html>
