<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Viva a adrenalina do rafting em meio 
    à natureza! Encare as corredeiras, supere desafios e crie memórias inesquecíveis 
    com nossa equipe.">
    <meta name="author" content="JOÃO SOUZA">
    <title>Fale Conosco | Rafting Aventura</title>
    <link rel="stylesheet" href="estilos/rafting.css">

</head>

<body>
    <header>
        <img class="logo" src="imagens/logo.jpg" alt="Logo da empresa Rafting Aventura" width="200">
        <nav>
            <ul>
                <li><a href="index.html">Página Inicial</a></li>
                <li><a href="sobre.html">Sobre Nós</a></li>
                <li><a href="passeios.html">Passeios</a></li>
                <li><a href="contato.html">Fale Conosco</a></li>
            </ul>
        </nav>
    </header>
    <main>

        <h1>Fale Conosco</h1>

        <section class="dados-contato">
            <h2>Companhia de Rafting em Corredeiras</h2>

            <p>123 Rua Principal do Rio</p>
            <p>Foz do Iguaçu, Paraná</p>
            <p>+55 45 99999-9999</p>
            <p>contato@raftingaventura.com</p>
        </section>

        <div class="contato">

            <iframe
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d1774.3555277986864!2d-46.73700821781462!3d-23.722548627772042!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94ce4ff44cb9e5e1%3A0x4a9345385aa32e0f!2sIlha%20das%20Cabras%20-%20Goat%20Island!5e0!3m2!1spt-BR!2sbr!4v1791304879876!5m2!1spt-BR!2sbr"
              width="350" height="350" allowfullscreen="" loading="lazy"
              referrerpolicy="strict-origin-when-cross-origin">
            </iframe>

            <form>

                <div class="dados-cliente">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome">

                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email">
                </div>

                <div class="proposito-mensagem">

                    <p>Propósito da Mensagem</p>

                    <div class="opcoes-motivo">
                        <label>
                            <input type="radio" name="motivo" value="duvida">
                            Consulta Geral
                        </label>

                        <label>
                            <input type="radio" name="motivo" value="reserva">
                            Pergunta sobre Reserva
                        </label>

                        <label>
                            <input type="radio" name="motivo" value="sugestao">
                            Sugestão de Site
                        </label>
                    </div>

                </div>

                <label for="mensagem">Mensagem</label>
                <textarea id="mensagem" name="mensagem" rows="5"
                  placeholder="Digite sua mensagem"></textarea>


                <label class="newsletter">
                    <input type="checkbox" id="newsletter" name="newsletter">
                    Por favor, me inscreva na newsletter mensal
                </label>


                <button type="submit">Entrar em Contato!</button>


            </form>

        </div>


        <div class="funcionarios">
            <figure>
                <img src="imagens/carlos.jpg" alt="Carlos, guia de rafting">
                <figcaption>Carlos — Guia de Rafting</figcaption>
            </figure>
            <figure>
                <img src="imagens/marina.jpg" alt="Marina, instrutora de Rafting">
                <figcaption>
                    <figcaption>Marina — Instrutora de Rafting</figcaption>
                </figcaption>
            </figure>
            <figure>
                <img src="imagens/rafael.jpg" alt="Rafael, gerente de Operações">
                <figcaption>Rafael — Gerente de Operações</figcaption>
            </figure>
        </div>
    </main>
    <footer>
        <p>&COPY; 2026 - RAFTING AVENTURA - JOÃO SOUZA</p>
        <nav class="socialmedia">
            <a href="https://www.instagram.com/"><img src="imagens/instagram-square.svg"
                  alt="Ícone do Instagram"></a>
            <a href="https://br.linkedin.com/"><img src="imagens/linkedin-square.svg"
                  alt="Ícone do LinkedIn"></a>
            <a href="https://wa.link/4gt8lu"><img src="imagens/whatsapp.svg"
                  alt="Ícone do WhatsApp"></a>

        </nav>

    </footer>
</body>

</html>
